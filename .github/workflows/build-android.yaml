name: Build Android (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK (always)
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: up-up-and-away-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Check release secrets
        id: relcheck
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "has_key=true" >> "$GITHUB_OUTPUT"; else echo "has_key=false" >> "$GITHUB_OUTPUT"; fi

      - name: Restore keystore + build release AAB
        if: steps.relcheck.outputs.has_key == 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF
          gradle :app:bundleRelease --stacktrace

      - name: Upload release AAB
        if: steps.relcheck.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: up-up-and-away-release-aab
          path: app/build/outputs/bundle/release/*.aab
          
